<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05060d"><title>Пять идей</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 500px at 80% -10%,#1d1450,transparent 60%),#05060d;color:#eceaff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
.box{max-width:340px}h1{font-size:22px;margin:12px 0}p{color:#9aa3d6;line-height:1.5}a{color:#c4b5fd}
.spin{width:38px;height:38px;border:3px solid #2c2a5a;border-top-color:#8b5cf6;border-radius:50%;margin:0 auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div class="box"><div class="spin"></div><h1>Пять идей</h1><p id="msg">Ищу ваш компьютер…</p></div>
<script>
// Постоянная ссылка: программа на ПК при каждом запуске пишет сюда адрес своего туннеля.
// Вход на сайт — только по PIN, здесь лежит лишь ссылка.
const REPO = 'milkandr940-lgtm/pyat-idei-link'
const OFFLINE = 'https://pyat-idei.flafik.workers.dev/m'
const msg = document.getElementById('msg')
async function current() {
  try { // GitHub API отдаёт свежий файл сразу (кэш Pages держит старый до 10 минут)
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/link.json', { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
    if (r.ok) return (await r.json()).url
  } catch {}
  try { const r = await fetch('link.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return (await r.json()).url } catch {}
  return null
}
;(async () => {
  const url = await current()
  if (!url) { msg.innerHTML = 'ПК сейчас выключен. Сохранённая копия (нужен VPN): <a href="' + OFFLINE + '">открыть</a>'; return }
  try { await fetch(url + '/m', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(8000) }) } catch {
    msg.innerHTML = 'ПК не отвечает (выключен или перезапускается). Сохранённая копия (нужен VPN): <a href="' + OFFLINE + '">открыть</a> · <a href="">повторить</a>'; return }
  location.replace(url + '/m')
})()
</script></body></html>
