<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000"><title>nuxnux</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app/icons/icon-180.png"><link rel="icon" href="app/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="nuxnux">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#eceaff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
.box{max-width:340px}h1{font-size:22px;margin:12px 0}p{color:#a1a1aa;line-height:1.5}a{color:#e4e4e7}
.spin{width:38px;height:38px;border:3px solid #27272a;border-top-color:#e4e4e7;border-radius:50%;margin:0 auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div class="box"><div class="spin"></div><h1>nuxnux</h1><p id="msg">Ищу ваш компьютер…</p></div>
<script>
// Постоянная ссылка «Пять идей». Куда идти (на ПК или в копию с Яндекс Диска), решает приложение app/:
// ПК раз в минуту отмечается на Диске, приложение читает отметку. Личный ключ после «#» — для входа на ПК.
var KEY = new URLSearchParams(location.hash.slice(1)).get('key') || ''
try { if (KEY) localStorage.setItem('vi_pair_key', KEY) } catch (e) {}
document.getElementById('msg').textContent = 'Открываю…'
location.replace('app/?v=' + Date.now())  // всегда свежая версия приложения
</script></body></html>
